spring.config.activate.on-profile=dev
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/recolte}
spring.datasource.username=${DB_USERNAME:recolte}
spring.datasource.password=${DB_PASSWORD:recolte}
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/recolte}
spring.r2dbc.username=${DB_USERNAME:recolte}
spring.r2dbc.password=${DB_PASSWORD:recolte}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
