spring.application.name=recolte
spring.profiles.default=dev
server.port=${SERVER_PORT:8000}
server.address=0.0.0.0

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION_MS:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
